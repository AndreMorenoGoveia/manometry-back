# Render blueprint. `render.yaml` at the repo root is picked up by
# "New > Blueprint"; everything below can also be set by hand in the dashboard.
services:
  - type: web
    name: manometry-back
    runtime: python
    # 2 GB. Serving the ConvNeXt-Tiny bundle peaks around 1.1 GB with the
    # torch runtime, so the 512 MB plans do not fit.
    plan: standard
    buildCommand: pip install -r requirements-cpu.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: MANOMETRY_CHECKPOINT
        value: assets/model/model.pt
      - key: MANOMETRY_RESULT_JSON
        value: assets/model/result.json
      - key: MANOMETRY_PREDICTIONS
        value: assets/model/test_predictions.npz
      - key: MANOMETRY_CALIBRATION
        value: assets/model/image_chicago_calibration.json
      - key: MANOMETRY_DEVICE
        value: cpu
      # The host reports every core of the machine and gives the container a
      # fraction of one; oversubscribing makes the forward pass slower.
      - key: MANOMETRY_TORCH_THREADS
        value: "2"
      - key: MANOMETRY_LAZY_MODEL
        value: "false"       # load at boot, so the health check gates traffic
      - key: MANOMETRY_ALLOWED_ORIGINS
        sync: false          # https://seu-projeto.vercel.app
      - key: MANOMETRY_ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: PYTHON_VERSION
        value: "3.12.7"
